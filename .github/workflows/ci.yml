name: Santor CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint check
        run: pnpm exec eslint .

      - name: Prettier check
        run: pnpm exec prettier --check .

      - name: API typecheck
        run: pnpm --filter @santor/api typecheck

      - name: API tests
        run: pnpm --filter @santor/api test

      - name: Build
        run: pnpm build
