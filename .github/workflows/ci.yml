name: Santor CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: santor
          POSTGRES_PASSWORD: santor
          POSTGRES_DB: santor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U santor -d santor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://santor:santor@localhost:5432/santor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @santor/api db:generate

      - name: Apply Prisma migrations
        run: pnpm --filter @santor/api db:deploy

      - name: ESLint check
        run: pnpm exec eslint .

      - name: Prettier check
        run: pnpm exec prettier --check .

      - name: API typecheck
        run: pnpm --filter @santor/api typecheck

      - name: API tests
        run: pnpm --filter @santor/api test

      - name: Build
        run: pnpm build
