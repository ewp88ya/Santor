name: Santor CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

# One-time formatting repair for the financial-dashboard commit.
jobs:
  quality-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: santor
          POSTGRES_PASSWORD: santor
          POSTGRES_DB: santor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U santor -d santor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://santor:santor@localhost:5432/santor
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @santor/api db:generate

      - name: Apply Prisma migrations
        run: pnpm --filter @santor/api db:deploy

      - name: Seed database
        run: pnpm --filter @santor/api db:seed

      - name: ESLint check
        run: pnpm exec eslint .

      - name: One-time Prettier repair
        if: github.event_name == 'push' && github.event.before == '7ef34a64325ae0dc9635b736e35be8934322ea8b'
        run: |
          pnpm exec prettier --write .
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix(ci): format admin changes"
          git push

      - name: Prettier check
        run: pnpm exec prettier --check .

      - name: Validate server-rendered public website
        run: python3 scripts/check-public-site.py

      - name: API typecheck
        run: pnpm --filter @santor/api typecheck

      - name: API tests
        run: pnpm --filter @santor/api test

      - name: Build
        run: pnpm build

      - name: Validate production Compose and build API container
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > .env.ci <<'EOF'
          POSTGRES_USER=santor
          POSTGRES_PASSWORD=ci-only-not-for-deployment
          POSTGRES_DB=santor
          DATABASE_URL=postgresql://santor:ci-only-not-for-deployment@postgres:5432/santor
          REDIS_URL=redis://redis:6379
          JWT_SECRET=ci-only-jwt-secret-not-for-production-0001
          SANTOR_INTERNAL_WEBHOOK_SECRET=ci-only-webhook-secret-not-for-production-0001
          CORS_ORIGINS=https://santor.app
          EOF
          trap 'rm -f .env.ci' EXIT
          docker compose --env-file .env.ci -f docker/docker-compose.yml config --quiet
          docker build -f docker/api/Dockerfile -t santor-api:ci .

      - name: Start web preview
        run: |
          nohup pnpm --filter @santor/web preview --host 127.0.0.1 > /tmp/santor-web-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173 > /dev/null

      - name: Browser functional QA
        run: |
          pnpm --filter @santor/web exec playwright install --with-deps chromium
          pnpm --filter @santor/web exec playwright test apps/web/qa/frontend-functional.spec.mjs
