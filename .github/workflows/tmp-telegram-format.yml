name: Temporary Telegram formatting

on:
  push:
    branches:
      - feat/telegram-account-linking

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write services/api/src/modules/ai/telegram.routes.ts services/api/src/modules/ai/telegram.service.ts
      - run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/src/modules/ai/telegram.routes.ts services/api/src/modules/ai/telegram.service.ts
          git commit -m "style: format Telegram integration files"
          git push
