services:
  postgres:
    image: postgres:16
    container_name: santor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-santor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-santor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [santor-network]

  redis:
    image: redis:7-alpine
    container_name: santor-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks: [santor-network]

  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    container_name: santor-api
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES: ${JWT_EXPIRES:-7d}
      SANTOR_INTERNAL_WEBHOOK_SECRET: ${SANTOR_INTERNAL_WEBHOOK_SECRET:?SANTOR_INTERNAL_WEBHOOK_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      LN_NEU_ENABLED: ${LN_NEU_ENABLED:-false}
      LN_NEU_API_URL: ${LN_NEU_API_URL:-}
      LN_NEU_API_KEY: ${LN_NEU_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      PROXY_PROVISIONER_URL: ${PROXY_PROVISIONER_URL:-}
      PROXY_PROVISIONER_KEY: ${PROXY_PROVISIONER_KEY:-}
      GLOBAL_CARD_ENABLED: ${GLOBAL_CARD_ENABLED:-false}
      GLOBAL_CARD_API_KEY: ${GLOBAL_CARD_API_KEY:-}
      GLOBAL_CARD_API_SECRET: ${GLOBAL_CARD_API_SECRET:-}
      GLOBAL_CARD_BASE_URL: ${GLOBAL_CARD_BASE_URL:-}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_BASE_URL: ${STRIPE_BASE_URL:-https://api.stripe.com}
      PAYPAL_ENABLED: ${PAYPAL_ENABLED:-false}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-https://api-m.paypal.com}
      PAYPAL_RETURN_URL: ${PAYPAL_RETURN_URL:-}
      PAYPAL_CANCEL_URL: ${PAYPAL_CANCEL_URL:-}
      XENDIT_ENABLED: ${XENDIT_ENABLED:-false}
      XENDIT_API_KEY: ${XENDIT_API_KEY:-}
      XENDIT_API_SECRET: ${XENDIT_API_SECRET:-}
      XENDIT_WEBHOOK_TOKEN: ${XENDIT_WEBHOOK_TOKEN:-}
      XENDIT_BASE_URL: ${XENDIT_BASE_URL:-https://api.xendit.co}
      RUSSIA_PAYMENT_ENABLED: ${RUSSIA_PAYMENT_ENABLED:-false}
      RUSSIA_PAYMENT_API_KEY: ${RUSSIA_PAYMENT_API_KEY:-}
      RUSSIA_PAYMENT_API_SECRET: ${RUSSIA_PAYMENT_API_SECRET:-}
      RUSSIA_PAYMENT_BASE_URL: ${RUSSIA_PAYMENT_BASE_URL:-}
      PLATEGA_MERCHANT_ID: ${PLATEGA_MERCHANT_ID:-}
      PLATEGA_SECRET: ${PLATEGA_SECRET:-}
      PLATEGA_BASE_URL: ${PLATEGA_BASE_URL:-https://app.platega.io}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET: ${YOOKASSA_SECRET:-}
      YOOKASSA_BASE_URL: ${YOOKASSA_BASE_URL:-https://api.yookassa.ru}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-}
      CLOUDPAYMENTS_PUBLIC_ID: ${CLOUDPAYMENTS_PUBLIC_ID:-}
      CLOUDPAYMENTS_API_SECRET: ${CLOUDPAYMENTS_API_SECRET:-}
      CLOUDPAYMENTS_BASE_URL: ${CLOUDPAYMENTS_BASE_URL:-https://api.cloudpayments.ru}
      ALIPAY_ENABLED: ${ALIPAY_ENABLED:-false}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_BASE_URL: ${ALIPAY_BASE_URL:-https://open-na-global.alipay.com}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL:-}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
      WECHAT_PAY_ENABLED: ${WECHAT_PAY_ENABLED:-false}
      WECHAT_PAY_APP_ID: ${WECHAT_PAY_APP_ID:-}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_PRIVATE_KEY: ${WECHAT_PAY_PRIVATE_KEY:-}
      WECHAT_PAY_SERIAL_NUMBER: ${WECHAT_PAY_SERIAL_NUMBER:-}
      WECHAT_PAY_BASE_URL: ${WECHAT_PAY_BASE_URL:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
    ports:
      - '127.0.0.1:3000:3000'
    extra_hosts:
      - 'host.docker.internal:172.16.1.1'
    networks: [santor-network]

volumes:
  postgres_data:
  redis_data:

networks:
  santor-network:
    driver: bridge
