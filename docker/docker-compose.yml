services:
  postgres:
    image: postgres:16
    container_name: santor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-santor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-santor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [santor-network]

  redis:
    image: redis:7-alpine
    container_name: santor-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks: [santor-network]

  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    container_name: santor-api
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES: ${JWT_EXPIRES:-7d}
      SANTOR_INTERNAL_WEBHOOK_SECRET: ${SANTOR_INTERNAL_WEBHOOK_SECRET:?SANTOR_INTERNAL_WEBHOOK_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_BASE_URL: ${STRIPE_BASE_URL:-https://api.stripe.com}
      XENDIT_ENABLED: ${XENDIT_ENABLED:-false}
      XENDIT_API_KEY: ${XENDIT_API_KEY:-}
      XENDIT_WEBHOOK_TOKEN: ${XENDIT_WEBHOOK_TOKEN:-}
      RUSSIA_PAYMENT_ENABLED: ${RUSSIA_PAYMENT_ENABLED:-false}
      PLATEGA_MERCHANT_ID: ${PLATEGA_MERCHANT_ID:-}
      PLATEGA_SECRET: ${PLATEGA_SECRET:-}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET: ${YOOKASSA_SECRET:-}
      CLOUDPAYMENTS_PUBLIC_ID: ${CLOUDPAYMENTS_PUBLIC_ID:-}
      CLOUDPAYMENTS_API_SECRET: ${CLOUDPAYMENTS_API_SECRET:-}
      PAYPAL_ENABLED: ${PAYPAL_ENABLED:-false}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
    ports:
      - '3000:3000'
    networks: [santor-network]

volumes:
  postgres_data:
  redis_data:

networks:
  santor-network:
    driver: bridge
